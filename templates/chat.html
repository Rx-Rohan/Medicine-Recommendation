<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat — Med Express</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <style>
    :root {
      --emerald: #00e5a0;
      --deep: #040d1a;
      --navy: #071428;
      --card-bg: rgba(255,255,255,0.04);
      --border: rgba(0,229,160,0.15);
      --text: #e8f4f0;
      --muted: rgba(232,244,240,0.55);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--deep); color: var(--text);
      height: 100vh; display: flex; flex-direction: column;
      overflow: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 10%, rgba(0,229,160,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(0,120,255,0.08) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    /* HEADER */
    .chat-header {
      display: flex; align-items: center; gap: 16px;
      padding: 18px 28px;
      background: rgba(4,13,26,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
      animation: slideDown 0.6s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes slideDown { from{transform:translateY(-100%);opacity:0} to{transform:translateY(0);opacity:1} }

    .bot-avatar {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: rgba(0,229,160,0.12);
      border: 1px solid rgba(0,229,160,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .bot-info { flex: 1; }
    .bot-name { font-family:'Syne',sans-serif; font-weight:700; font-size:1rem; }
    .bot-status {
      font-size: 0.78rem; color: var(--emerald);
      display: flex; align-items: center; gap: 6px;
    }
    .bot-status::before {
      content: ''; width:6px; height:6px; border-radius:50%;
      background: var(--emerald);
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .header-back {
      color: var(--muted); text-decoration: none;
      font-size: 0.88rem; font-weight: 500;
      display: flex; align-items: center; gap: 6px;
      transition: color 0.2s;
    }
    .header-back:hover { color: var(--emerald); }

    /* MESSAGES */
    .messages-area {
      flex: 1; overflow-y: auto;
      padding: 28px 24px;
      display: flex; flex-direction: column; gap: 16px;
      position: relative; z-index: 1;
      scroll-behavior: smooth;
    }
    .messages-area::-webkit-scrollbar { width: 4px; }
    .messages-area::-webkit-scrollbar-track { background: transparent; }
    .messages-area::-webkit-scrollbar-thumb { background: rgba(0,229,160,0.2); border-radius: 2px; }

    /* Bubble wrappers */
    .msg-row { display: flex; align-items: flex-end; gap: 10px; animation: msgIn 0.4s cubic-bezier(.16,1,.3,1) both; }
    @keyframes msgIn { from{transform:translateY(16px);opacity:0} to{transform:translateY(0);opacity:1} }
    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px; border-radius: 10px;
      background: rgba(0,229,160,0.1); border: 1px solid rgba(0,229,160,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; flex-shrink: 0;
    }
    .msg-avatar.user-av { background: rgba(0,120,255,0.12); border-color: rgba(0,120,255,0.25); }

    .bubble {
      max-width: 70%;
      padding: 13px 18px;
      border-radius: 18px;
      font-size: 0.93rem;
      line-height: 1.65;
      position: relative;
    }
    .bubble.bot {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }
    .bubble.user {
      background: rgba(0,229,160,0.14);
      border: 1px solid rgba(0,229,160,0.25);
      border-bottom-right-radius: 4px;
      color: var(--text);
    }
    .msg-time { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }
    .msg-row.user .msg-time { text-align: right; }

    /* Typing indicator */
    .typing-row { display: flex; align-items: flex-end; gap: 10px; }
    .typing-dots {
      display: flex; gap: 4px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px; border-bottom-left-radius: 4px;
      padding: 14px 18px;
    }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--emerald); opacity: 0.6;
      animation: dot-bounce 1.2s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-bounce { 0%,80%,100%{transform:scale(0.6);opacity:0.4} 40%{transform:scale(1);opacity:1} }

    /* INPUT */
    .chat-footer {
      padding: 16px 24px 24px;
      background: rgba(4,13,26,0.9);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }
    .input-row {
      display: flex; gap: 12px; align-items: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(0,229,160,0.2);
      border-radius: 16px;
      padding: 8px 8px 8px 20px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .input-row:focus-within {
      border-color: var(--emerald);
      box-shadow: 0 0 0 3px rgba(0,229,160,0.1);
    }
    #chatInput {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-family:'DM Sans',sans-serif; font-size:0.95rem;
      padding: 8px 0;
    }
    #chatInput::placeholder { color: rgba(232,244,240,0.3); }
    .send-btn {
      width: 42px; height: 42px;
      background: var(--emerald);
      border: none; border-radius: 12px;
      color: var(--deep);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1rem;
      transition: transform 0.2s, box-shadow 0.2s;
      flex-shrink: 0;
    }
    .send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(0,229,160,0.35); }
    .send-btn:active { transform: scale(0.97); }

    /* Welcome message */
    .welcome-msg {
      text-align: center;
      padding: 32px 16px;
      opacity: 0.7;
    }
    .welcome-msg .w-icon { font-size: 2.5rem; margin-bottom: 12px; display: block; }
    .welcome-msg p { color: var(--muted); font-size: 0.9rem; line-height: 1.7; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="chat-header">
    <a href="/" class="header-back">← Back</a>
    <div class="bot-avatar">🤖</div>
    <div class="bot-info">
      <div class="bot-name">Med Express AI</div>
      <div class="bot-status">Online — Ask me anything</div>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages-area" id="messageArea">
    <div class="welcome-msg">
      <span class="w-icon">💊</span>
      <p>Hello! I'm Med Express AI.<br>Ask me about medicines, symptoms, or health advice.</p>
    </div>
  </div>

  <!-- Footer Input -->
  <div class="chat-footer">
    <div class="input-row">
      <input type="text" id="chatInput" placeholder="Type your message..." autocomplete="off">
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>

  <script>
    const msgArea = document.getElementById('messageArea');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    function getTime() {
      const d = new Date();
      return d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
    }

    function addMessage(text, isUser) {
      const row = document.createElement('div');
      row.className = 'msg-row' + (isUser ? ' user' : '');
      const av = document.createElement('div');
      av.className = 'msg-avatar' + (isUser ? ' user-av' : '');
      av.textContent = isUser ? '👤' : '🤖';
      const wrap = document.createElement('div');
      const bub = document.createElement('div');
      bub.className = 'bubble ' + (isUser ? 'user' : 'bot');
      bub.textContent = text;
      const time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = getTime();
      wrap.appendChild(bub);
      wrap.appendChild(time);
      row.appendChild(av);
      row.appendChild(wrap);
      msgArea.appendChild(row);
      msgArea.scrollTop = msgArea.scrollHeight;
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'typing-row';
      row.id = 'typingIndicator';
      const av = document.createElement('div');
      av.className = 'msg-avatar';
      av.textContent = '🤖';
      const dots = document.createElement('div');
      dots.className = 'typing-dots';
      dots.innerHTML = '<span></span><span></span><span></span>';
      row.appendChild(av);
      row.appendChild(dots);
      msgArea.appendChild(row);
      msgArea.scrollTop = msgArea.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      addMessage(text, true);
      chatInput.value = '';
      showTyping();
      $.ajax({
        data: { msg: text },
        type: 'POST',
        url: '/chat'
      }).done(function(data) {
        removeTyping();
        addMessage(data, false);
      }).fail(function() {
        removeTyping();
        addMessage('Sorry, I could not connect to the server. Please try again.', false);
      });
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
